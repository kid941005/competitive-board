# PostgreSQL override —— 叠加在 docker-compose.yml 之上使用：
#
#   docker compose -f docker-compose.yml -f docker-compose.pg.yml up -d
# 要用本地源码构建，再叠加 docker-compose.build.yml。
#
# ⚠️ 密码在下面三处（DATABASE_URL / POSTGRES_PASSWORD），部署前请一起改。
#    且 PostgreSQL 的密码**只在数据目录首次初始化时生效**：pgdata 卷已存在时
#    改这里不起作用，需要先进库 ALTER USER，或删除卷重建（会丢数据）。
#
# 与 deploy/docker-compose.yml 的区别：这里只跑本应用（对比 + 规格书导入），
# 不包含 RSSHub / changedetection 等尚未启用的采集组件。

services:
  app:
    environment:
      DATABASE_URL: "postgresql+psycopg://ciboard:ciboard-change-me@db:5432/ciboard"
    depends_on:
      db:
        condition: service_healthy

  db:
    # 用 pgvector 版本而非纯 postgres：扩展随时可用，将来接向量检索（新闻去重/相似文章）不用换镜像。
    image: pgvector/pgvector:pg16
    container_name: competitive-board-db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: "ciboard"
      POSTGRES_USER: "ciboard"
      POSTGRES_PASSWORD: "ciboard-change-me"
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: "Asia/Shanghai"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=80
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 不映射宿主端口；本地连库用 docker compose exec db psql -U ciboard -d ciboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciboard -d ciboard"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
    name: competitive-board-pgdata
