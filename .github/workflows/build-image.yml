name: build-image

# 触发方式：
#   1) 推 v* 标签 —— 版本号取自标签；
#   2) 手动运行（workflow_dispatch）—— 版本号可填，留空则读 backend/app/main.py 的 app.version。
# 产物：ghcr.io/<owner>/<repo>:<version> / :latest / :sha-<7位>
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像标签（留空则读取 app.version）"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # 先跑测试再构建：镜像一旦推上去就会被拉取，宁可不发也不要发一个测试不过的版本
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 版本号散落在四处（app.version / 根 compose / 构建叠加 / deploy 规划稿 / README 示例），
      # 已经因此漏过一次（Dockerfile 里曾停留在 0.2.0），这里直接卡住。
      # 用 Python 而不是 grep：镜像标签大多写成 ${CIB_IMAGE_TAG:-0.7.3}，
      # 按「competitive-board:0.7.3」去 grep 会一条都匹配不到，检查等于没做。
      - name: 版本一致性
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          V = re.search(r'version="([0-9.]+)"',
                        pathlib.Path('backend/app/main.py').read_text(encoding='utf-8')).group(1)
          checks = {
              # 这两个文件已改成字面值（不再有 ${CIB_IMAGE_TAG:-x} 变量），
              # 直接从 image 标签与 build arg 提取
              'docker-compose.yml': r'competitive-board:([0-9]+\.[0-9]+\.[0-9]+)',
              'docker-compose.build.yml': r'APP_VERSION:\s*"([0-9]+\.[0-9]+\.[0-9]+)"',
              'deploy/docker-compose.yml': r'CIB_IMAGE_TAG:-([0-9]+\.[0-9]+\.[0-9]+)',
              'README.md': r'ghcr\.io/kid941005/competitive-board:([0-9]+\.[0-9]+\.[0-9]+)',
          }
          print(f"app.version = {V}")
          bad = not V
          for name, pattern in checks.items():
              path = pathlib.Path(name)
              if not path.exists():
                  print(f"::warning::{name} 不存在，跳过")
                  continue
              found = sorted(set(re.findall(pattern, path.read_text(encoding='utf-8'))))
              print(f"{name}: {found}")
              if found != [V]:
                  print(f"::error::{name} 的版本 {found} 与 app.version({V}) 不一致")
                  bad = True
          sys.exit(1 if bad else 0)
          PY

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      # 只开 F/E9/B 三条（见 pyproject.toml）：抓未使用导入、未定义名、常见陷阱。
      # 不做行宽与风格检查 —— 本项目注释密度高，强制 88 列会压缩「为什么」的说明。
      - name: 静态检查
        run: python -m ruff check backend/app backend/tests

      # 每个测试文件独立进程：它们都在导入期设置 CIB_DATA_DIR，
      # 同一个进程里跑会共用临时目录而互相污染
      - name: 后端测试
        working-directory: backend
        run: |
          set -euo pipefail
          for f in tests/test_*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

      - name: 前端交互测试
        working-directory: backend
        run: node tests/js/test_datasheet_ui.js

  build:
    name: 构建并推送
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本
        id: ver
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          V="${INPUT_TAG:-}"
          if [ -z "$V" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME}"
          fi
          if [ -z "$V" ]; then
            V=$(python3 -c "import re,pathlib;print(re.search(r'version=\"([0-9.]+)\"',pathlib.Path('backend/app/main.py').read_text()).group(1))")
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "镜像版本：$V"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # 只构建 amd64：arm64 要过 QEMU，构建时间翻数倍且本项目部署环境是 x86
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.ver.outputs.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出摘要
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo '```'
            echo "${{ env.IMAGE }}:${{ steps.ver.outputs.version }}"
            echo "${{ env.IMAGE }}:latest"
            echo "${{ env.IMAGE }}:sha-${{ steps.ver.outputs.sha }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
            echo ""
            echo "拉取：\`docker pull ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
